name: Adventure Log

on:
  schedule:
    - cron: "17 0 * * *"   # daily, just after midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild contribution graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/build_contrib.py ${{ github.repository_owner }}
      - name: Commit if changed
        run: |
          git diff --quiet -- assets/cn/contributions.svg && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cn/contributions.svg
          git commit -m "Refresh Adventure Log contribution graph"
          git push
